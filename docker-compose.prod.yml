services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_studio"]
      interval: 3s
      timeout: 3s
      retries: 30

  db-push:
    image: ai-studio:prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-lc", "npm run db:push"]
    restart: "no"

  app:
    image: ai-studio:prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "5000"
      NODE_ENV: production
    depends_on:
      db-push:
        condition: service_completed_successfully
    ports:
      - "5000:5000"

volumes:
  pgdata:
