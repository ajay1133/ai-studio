services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_studio"]
      interval: 3s
      timeout: 3s
      retries: 30

  db-push:
    image: ai-studio:dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: ["sh", "-lc", "npm run db:push"]
    restart: "no"

  app:
    image: ai-studio:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "5000"
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      db-push:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: ["sh", "-lc", "npm run dev"]

volumes:
  pgdata:
